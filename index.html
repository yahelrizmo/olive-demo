<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>olive — דמו</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Heebo', sans-serif; background: linear-gradient(148deg, #2d3b20 0%, #1c1008 55%, #2a1508 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }

    .logo-wrap { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .logo-wrap img { width: 52px; height: 52px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.12); padding: 6px; }
    .logo-wrap h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 5px; color: white; text-transform: lowercase; text-shadow: 0 2px 14px rgba(0,0,0,0.5); }

    .tagline { color: rgba(255,255,255,0.55); font-size: 0.9rem; margin-bottom: 3rem; text-align: center; }

    .cards { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 400px; }

    a.demo-card { display: flex; align-items: center; gap: 1.2rem; background: rgba(238,231,221,0.95); border-radius: 16px; padding: 1.2rem 1.5rem; text-decoration: none; color: #4D2115; transition: transform 0.18s, box-shadow 0.18s; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    a.demo-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

    .card-icon { font-size: 1.8rem; flex-shrink: 0; }
    .card-text h2 { font-size: 1rem; font-weight: 700; margin-bottom: 0.2rem; }
    .card-text p { font-size: 0.8rem; color: #7A8570; }
    .card-arrow { margin-right: auto; color: #78855F; font-size: 1.2rem; }

    .hint { color: rgba(255,255,255,0.3); font-size: 0.72rem; margin-top: 2rem; text-align: center; }
    .hint span { color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img src="logo-olive.png" alt="olive">
    <h1>olive</h1>
  </div>
  <div class="tagline">פלטפורמת ניהול לסטודיו — גרסת הדגמה</div>

  <div class="cards">
    <a href="admin.html" class="demo-card">
      <div class="card-icon">🗂️</div>
      <div class="card-text">
        <h2>ממשק ניהול</h2>
        <p>לקוחות, מנויים, שיעורים · קוד: 1234</p>
      </div>
      <div class="card-arrow">←</div>
    </a>

    <a href="schedule.html" class="demo-card">
      <div class="card-icon">📅</div>
      <div class="card-text">
        <h2>הרשמה לשיעורים</h2>
        <p>כפי שהלקוחה רואה · טלפון: 052-1111111</p>
      </div>
      <div class="card-arrow">←</div>
    </a>

    <a href="register.html" class="demo-card">
      <div class="card-icon">🪪</div>
      <div class="card-text">
        <h2>רכישת מנוי</h2>
        <p>דף הרשמה ותשלום ללקוחה חדשה</p>
      </div>
      <div class="card-arrow">←</div>
    </a>
  </div>

  <div class="hint">powered by <span>olive</span> 🫒 · גרסת דמו בלבד</div>

</body>
</html>
