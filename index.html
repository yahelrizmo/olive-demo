<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>olive</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(148deg, #2d3b20 0%, #1c1008 55%, #2a1508 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    img.logo { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; background: rgba(255,255,255,0.1); padding: 10px; margin-bottom: 1.5rem; }

    h1 { font-size: 1.1rem; font-weight: 300; color: rgba(255,255,255,0.65); letter-spacing: 1px; margin-bottom: 0.5rem; }
    h2 { font-size: 2.4rem; font-weight: 800; color: white; letter-spacing: 3px; text-transform: lowercase; text-shadow: 0 2px 20px rgba(0,0,0,0.4); margin-bottom: 2.5rem; }

    p { color: rgba(255,255,255,0.6); font-size: 1rem; font-weight: 300; margin-bottom: 2rem; line-height: 1.7; }

    a.btn {
      display: inline-block;
      background: #78855F;
      color: white;
      font-family: 'Heebo', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 1rem 2.5rem;
      border-radius: 100px;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    a.btn:hover { background: #606A4C; transform: translateY(-2px); }

    .powered { position: absolute; bottom: 2rem; color: rgba(255,255,255,0.2); font-size: 0.7rem; letter-spacing: 1px; }
  </style>
</head>
<body>

  <img src="logo-olive.png" alt="olive" class="logo">
  <h1>ברוכים הבאים ל</h1>
  <h2>olive</h2>
  <p>לצפייה באפליקציה שלנו לחצו כאן</p>
  <a href="admin.html" class="btn">כניסה לאפליקציה</a>

  <div class="powered">powered by olive</div>

</body>
</html>
